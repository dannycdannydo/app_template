# CI workflow (blueprint §37, v0.3 Scope §6.8).
#
# One shared workflow runs the quality gate on every push to main and on
# every pull request. Jobs map to the release checklist items: backend
# format/lint, backend typecheck, backend tests, storage integration tests
# against MinIO (v0.5 Scope §6.7), frontend format/lint, frontend typecheck,
# frontend tests, generated-client drift, migration validity, container
# build, and the Playwright smoke journeys (v0.3 Scope §6.8: "Playwright
# smoke journeys wired into CI").
#
# Local `make lint` auto-fixes; CI runs the same checks in check-only mode
# (no --fix) so formatting and lint failures fail the build instead of being
# silently corrected. The `check` target's drift gate is covered by the
# dedicated generate-client-drift job.
#
# Toolchain versions are pinned to match the local toolchain and the
# Dockerfiles (uv 0.12.1, pnpm 11.13.0, Node 24, Python 3.13, Postgres 17).

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.1"
  PYTHON_VERSION: "3.13"
  PNPM_VERSION: "11.13.0"
  NODE_VERSION: "24"

jobs:
  backend-format-lint:
    name: Backend formatting & linting (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-python: true
      - name: Sync dependencies from lockfile
        run: uv sync --frozen
      - name: Check formatting (Ruff format)
        run: uv run ruff format --check .
      - name: Lint (Ruff)
        run: uv run ruff check .

  backend-typecheck:
    name: Backend type checks (Pyright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-python: true
      - name: Sync dependencies from lockfile
        run: uv sync --frozen
      - name: Typecheck (Pyright)
        run: uv run pyright

  backend-test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_template_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_template_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Durable-jobs integration tests (Scope §6.4, blueprint §18): the job
      # lifecycle and retry policy run against a real broker here, the same
      # Redis every environment uses. The tests probe localhost:6379 and skip
      # when the service is missing, so local `make test` without Redis stays
      # green.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    # conftest.py falls back to this same URL, so a PostgreSQL service turns
    # the migration smoke test into a real upgrade/downgrade run.
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app_template_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-python: true
      - name: Sync dependencies from lockfile
        run: uv sync --frozen
      - name: Test (pytest)
        run: uv run pytest

  # MinIO-backed storage integration tests (v0.5 Scope §6.7, blueprint §17):
  # the S3 adapter is proven against a real S3-compatible server — signed
  # upload round trip, private-bucket denial (unsigned GET -> 403) and lazy
  # bucket creation. The tests carry the `storage_integration` marker and are
  # excluded from the default `make test` suite (see backend/pyproject.toml),
  # so this dedicated service-backed job is where that marker runs. The
  # `edge-cicd` image starts the server by default (its `CMD` runs
  # `server /data`), which the release images do not; the local Compose stack
  # stays on the pinned release and passes the server command explicitly.
  storage-integration:
    name: Storage integration tests (MinIO)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      minio:
        image: minio/minio:edge-cicd
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      STORAGE_PROVIDER: s3
      STORAGE_BUCKET: ci-storage-tests
      STORAGE_ENDPOINT_URL: http://localhost:9000
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: minioadmin
      STORAGE_SECRET_ACCESS_KEY: minioadmin
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-python: true
      - name: Sync dependencies from lockfile
        run: uv sync --frozen
      - name: Test the S3 adapter against MinIO
        run: uv run pytest -m storage_integration

  frontend-format-lint:
    name: Frontend formatting & linting (Prettier + ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          install: false
          cache: true
          package-json-file: frontend/package.json
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Check formatting (Prettier)
        run: pnpm exec prettier --check .
      - name: Lint (oxlint)
        run: pnpm exec oxlint .
      - name: Lint (ESLint)
        run: pnpm exec eslint .

  frontend-typecheck:
    name: Frontend type checks (vue-tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          install: false
          cache: true
          package-json-file: frontend/package.json
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Typecheck (vue-tsc)
        run: pnpm type-check

  frontend-test:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          install: false
          cache: true
          package-json-file: frontend/package.json
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Test (Vitest)
        run: pnpm vitest run

  generate-client-drift:
    name: Generated-client drift detection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-python: true
      - uses: pnpm/setup@v2.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          install: false
          cache: true
          package-json-file: frontend/package.json
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Sync backend dependencies from lockfile
        run: uv sync --frozen
        working-directory: backend
      - name: Install frontend dependencies from lockfile
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      # The exported openapi.json is a gitignored build artifact; only the
      # generated TypeScript client is committed, so drift means the diff is
      # non-empty (blueprint §15, v0.1 Scope §6.6).
      - name: Regenerate client and fail on drift
        run: |
          make generate-client
          git diff --exit-code -- frontend/src/api/generated/openapi.d.ts

  migration-validity:
    name: Migration validity (Alembic on fresh DB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-python: true
      - name: Sync dependencies from lockfile
        run: uv sync --frozen
      - name: Upgrade to head on a fresh database
        run: uv run alembic upgrade head
      - name: Downgrade back to base
        run: uv run alembic downgrade base
      - name: Upgrade again (idempotent re-apply)
        run: uv run alembic upgrade head

  container-build:
    name: Container build (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
          - image: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.2.0
      - name: Build image (validation only, no push)
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan tracked history and working tree for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Hybrid VPS Compose validation (Scope §6.6, blueprint §35.1): the generic
  # VPS profile must keep validating from a clean checkout. REDIS_PASSWORD is
  # a secret, so it is exported here (fail-fast in the compose file) and the
  # environment file is replaced by /dev/null for the check.
  compose-hybrid-vps-validation:
    name: Hybrid VPS Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate the generic VPS compose profile
        env:
          REDIS_PASSWORD: ci-validation-placeholder
          ENV_FILE: /dev/null
        run: docker compose -f deploy/compose/compose.hybrid-vps.yml config --quiet

  # Edge validation (Scope §6.6, blueprint §35.1): the pinned Caddy image
  # (v2.11.4 + caddy-ratelimit v0.1.0) builds, the Caddyfile parses and is
  # formatted, so the edge rate-limiting implementation stays reproducible
  # and tested every push.
  caddy-edge-validation:
    name: Caddy edge validation (pinned rate-limit build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build the pinned Caddy image
        run: docker build --tag app-template-caddy:ci deploy/caddy
      - name: Validate the Caddyfile
        run: >-
          docker run --rm
          -e DOMAIN=app.example.com
          -e ACME_EMAIL=ops@example.com
          -v "$PWD/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          app-template-caddy:ci
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Check the Caddyfile is formatted
        run: >-
          docker run --rm
          -v "$PWD/deploy/caddy/Caddyfile:/src/Caddyfile:ro"
          app-template-caddy:ci
          sh -c "cp /src/Caddyfile /tmp/Caddyfile && caddy fmt --overwrite /tmp/Caddyfile && cmp -s /src/Caddyfile /tmp/Caddyfile"

  dependency-review:
    name: Dependency vulnerability scan
    if: github.event_name == 'pull_request'
    # OSV-Scanner PR diff scan (uv.lock + pnpm-lock.yaml). GitHub's
    # dependency-review-action requires Dependency graph + GitHub Advanced
    # Security, which are unavailable on this personal repo; OSV-Scanner
    # keeps the same "fail on newly introduced vulnerable dependencies"
    # gate against the public OSV database. SARIF upload is disabled for
    # the same GHAS availability reason.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.3.8
    with:
      upload-sarif: false

  container-scan:
    name: Container vulnerability scan (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
          - image: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v7
      - name: Build local image for scanning
        run: docker build --tag app-template-${{ matrix.image }}:scan ${{ matrix.context }}
      - name: Fail on high or critical image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: app-template-${{ matrix.image }}:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  # Playwright smoke journeys (blueprint §31, §37; v0.3 Scope §6.8). The
  # specs stub the WorkOS token endpoint and the `/api/v1/**` surface at the
  # browser network boundary (see frontend/e2e/helpers.ts), so no backend or
  # real WorkOS credentials are needed. CI runs the production preview build
  # served on port 4173. A dummy client id keeps the authenticated journeys
  # active: the injected test-profile session is mocked end-to-end and the
  # id is never validated against a real WorkOS application. The files
  # journey (upload intent + table, v0.5 Scope §6.6) is one of the specs.
  playwright-smoke:
    name: Playwright smoke journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_WORKOS_CLIENT_ID: ci_dummy_client_id
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
          runtime: node@${{ env.NODE_VERSION }}
          install: false
          cache: true
          package-json-file: frontend/package.json
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile
      - name: Build the production bundle (served by `pnpm preview`)
        run: pnpm build
      - name: Install the Playwright Chromium browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the smoke journeys (Chromium)
        run: pnpm exec playwright test --project=chromium
