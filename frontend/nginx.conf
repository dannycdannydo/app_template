# Serves the built SPA and proxies API traffic to the backend container
# (blueprint §36). Mirrors the dev-server proxy in vite.config.ts so the
# frontend behaves identically under `make dev` (Vite proxy) and
# `make dev-docker` (nginx proxy).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Browser-facing defence in depth. TLS is terminated by the deployment
    # edge in production, so HSTS belongs there rather than this HTTP-only
    # local-development container.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.workos.com; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    # API reverse proxy. The generated client uses a relative base URL, so all
    # API traffic is same-origin and lands here.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /health {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    location = /ready {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    # SPA history-mode fallback: unknown paths serve the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
