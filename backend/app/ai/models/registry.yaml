    quality_tier: economy
    latency_tier: interactive
    priority: 1000
    max_attachment_bytes: 5242880
    max_total_attachment_bytes: 10485760
    # v0.8 Scope §2.4/§6.4: the Vertex model also declares the reviewed
    # storage_reference mode (private same-region GCS staging bucket) with a
    # per-mode PDF ceiling that mirrors the provider transfer contract.
    allowed_transfer_modes:
      - inline
      - storage_reference
    transfer_mode_limits:
      storage_reference:
        mime_types:
          - application/pdf
        max_bytes: 50000000
    attachment_mime_types:
      - application/pdf
      - image/jpeg
      - image/png
      - image/webp
      - text/plain
    pricing:
      currency: USD
      input_price_per_million_tokens: "0.10"
      output_price_per_million_tokens: "0.40"
      effective_date: 2026-08-10
      owner: Template maintainers
    available: true
