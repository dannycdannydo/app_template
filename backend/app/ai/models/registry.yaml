models:
  - id: fake.document-classifier
    provider: fake
    model: fake-model-document.classify
    capabilities:
      - structured_output
      - reasoning
      - documents
    context_window: 16384
    supported_parameters:
      - max_tokens
      - temperature
    quality_tier: economy
    latency_tier: interactive
    priority: 0
    max_attachment_bytes: 5242880
    max_total_attachment_bytes: 10485760
    # v0.8 Scope §2.2: the deterministic fake declares every transfer mode so
    # the default suite can exercise non-inline orchestration hermetically; the
    # fake provider transfer contract mirrors these declarations. Real-provider
    # models add non-inline modes in their own adapter checkpoints (§6.4–§6.6).
    allowed_transfer_modes:
      - inline
      - provider_upload
      - managed_signed_url
      - storage_reference
    # v0.8 Scope §2.2: per-mode MIME sets and byte ceilings, one entry per
    # non-inline mode declared above. The fake provider contract mirrors these
    # declarations; real-provider models add non-inline modes in their own
    # adapter checkpoints (§6.4–§6.6).
    transfer_mode_limits:
      provider_upload:
        mime_types:
          - application/pdf
        max_bytes: 50000000
      managed_signed_url:
        mime_types:
          - application/pdf
        max_bytes: 50000000
      storage_reference:
        mime_types:
          - application/pdf
        max_bytes: 50000000
    attachment_mime_types:
      - application/json
      - application/pdf
      - image/jpeg
      - image/png
      - image/webp
      - text/csv
      - text/markdown
      - text/plain
    pricing:
      currency: USD
      input_price_per_million_tokens: "0"
      output_price_per_million_tokens: "0"
      effective_date: 2026-08-10
      owner: Template maintainers
    available: true
  - id: local.document-classifier
    provider: local
    model: local-document-classifier
    capabilities:
      - structured_output
    context_window: 16384
    supported_parameters:
      - max_tokens
      - temperature
    quality_tier: economy
    latency_tier: interactive
    priority: 100
    pricing:
      currency: USD
      input_price_per_million_tokens: "0"
      output_price_per_million_tokens: "0"
      effective_date: 2026-08-10
      owner: Template maintainers
    available: true
  # Real provider models (v0.7 Scope §6.3). These make the documented routing
  # story true: a reviewed configuration change (allowed_providers /
  # model_override) moves a task between providers without feature-code
  # changes (acceptance criterion §5.2). Priorities keep the fake first for
  # the deterministic test default; availability and pricing are reviewed
  # configuration with an owner and effective date.
  - id: openai.gpt-4o-mini
    provider: openai
    model: gpt-4o-mini
    capabilities:
      - structured_output
      - documents
    context_window: 128000
    supported_parameters:
      - max_tokens
      - temperature
    quality_tier: economy
    latency_tier: interactive
    priority: 1000
    max_attachment_bytes: 5242880
    max_total_attachment_bytes: 10485760
    # v0.8 Scope §2.2: real-provider models declare inline only until their
    # adapter checkpoint adds a reviewed non-inline mode (§6.4–§6.6).
    allowed_transfer_modes:
      - inline
    attachment_mime_types:
      - application/json
      - application/pdf
      - image/jpeg
      - image/png
      - image/webp
      - text/csv
      - text/markdown
      - text/plain
    pricing:
      currency: USD
      input_price_per_million_tokens: "0.15"
      output_price_per_million_tokens: "0.60"
      effective_date: 2026-08-10
      owner: Template maintainers
    available: true
  # Anthropic model pinned for the inference-geography contract (v0.7 Scope
  # §6.3 regional amendment): only Claude 4.6+ models accept the top-level
  # ``inference_geo`` field, so claude-3-5-haiku-latest would return 400 the
  # moment the setting is used (official contract:
  # https://platform.claude.com/docs/en/manage-claude/data-residency).
  # claude-sonnet-4-6 is the economy-tier 4.6+ model in this template.
  - id: anthropic.claude-sonnet-4-6
    provider: anthropic
    model: claude-sonnet-4-6
    capabilities:
      - structured_output
      - documents
    context_window: 200000
    supported_parameters:
      - max_tokens
      - temperature
    quality_tier: economy
    latency_tier: interactive
    priority: 1000
    max_attachment_bytes: 5242880
    max_total_attachment_bytes: 10485760
    # v0.8 Scope §2.2: inline only until the §6.5 adapter checkpoint lands.
    allowed_transfer_modes:
      - inline
    attachment_mime_types:
      - application/pdf
      - image/jpeg
      - image/png
      - image/webp
    pricing:
      currency: USD
      input_price_per_million_tokens: "3.00"
      output_price_per_million_tokens: "15.00"
      effective_date: 2026-08-10
      owner: Template maintainers
    available: true
