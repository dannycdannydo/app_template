    max_attachment_bytes: 5242880
    max_total_attachment_bytes: 10485760
    # v0.8 Scope §2.2: inline only; Azure non-inline input is deferred (Scope §2.4).
    allowed_transfer_modes:
      - inline
    attachment_mime_types:
      - application/json
      - application/pdf
      - image/jpeg
      - image/png
      - image/webp
      - text/csv
