  # Vertex AI Gemini (ADR-0018): model id is the Vertex model name; the
  # project/location come from configuration, never from a Gemini API key.
  - id: vertex.gemini-2.0-flash
    provider: vertex
    model: gemini-2.0-flash
    capabilities:
      - structured_output
      - documents
    context_window: 1000000
    supported_parameters:
