name: document.classify
prompt_name: document.classify
prompt_version: 1
input_variables:
  - storage_reference
required_capabilities:
  - structured_output
  - documents
parameter_defaults:
  max_tokens: 256
  temperature: 0
output_schema: app.ai.tasks.schemas.DocumentClassificationResult
declares_text_result: false
# v0.7 Scope §2/§6.6 retention choice: the demonstration task opts into
# retaining its validated output content so the durable result endpoint can
# return the classification under the organisation's retention policy.
retains_output_content: true
retry_policy:
  max_attempts: 3
  repair_attempts: 1
fallback_policy:
  allowed: true
  prefer_same_provider: false
  allow_local: true
model_preferences:
  - fake.document-classifier
quality_tier: economy
latency_tier: interactive
max_input_tokens: 4096
max_estimated_cost: "0.01"
