name: document.ask
prompt_name: document.ask
prompt_version: 1
input_variables:
  - storage_reference
  - question
required_capabilities:
  - documents
parameter_defaults:
  # Thinking-capable models count hidden reasoning against maxOutputTokens.
  # Leave enough room for that reasoning plus a useful document summary.
  max_tokens: 12288
  temperature: 0
declares_text_result: true
# v0.8 Scope §2.2/§6.5: the demonstration QA task carries a PDF inline at or
# below the 5,000,000-byte aggregate threshold and above it through a
# non-inline staging path the routed model/provider declare: the Vertex
# private GCS staging path (storage_reference) when Vertex is routed, the
# OpenAI Files API upload path (provider_upload) for a transient scratch
# source, or the just-in-time signed-URL path (managed_signed_url) for a
# retained private source when the OpenAI adapter is routed.
allowed_transfer_modes:
  - inline
  - provider_upload
  - managed_signed_url
  - storage_reference
# The durable ask result endpoint needs the validated answer. Content is still
# retained only when the organisation's explicit retention policy permits it;
# the existing retention job deletes it on that schedule (BP §28, ADR-0017).
retains_output_content: true
retry_policy:
  max_attempts: 2
  repair_attempts: 0
fallback_policy:
  allowed: true
  prefer_same_provider: false
  allow_local: true
model_preferences:
  # Vertex first so the UI test routes through Vertex when the adapter is
  # configured (v0.8 Scope §6.4); OpenAI next so an OpenAI-only deployment
  # routes a transient PDF through the Files API upload path (§6.5); the
  # deterministic fake stays as the configured-provider fallback so the
  # default suite exercises the same task hermetically and the demo keeps
  # working without provider credentials.
  - vertex.gemini-2.0-flash
  - openai.gpt-4o-mini
  - fake.document-classifier
quality_tier: economy
latency_tier: interactive
max_input_tokens: 4096
max_estimated_cost: "0.02"
