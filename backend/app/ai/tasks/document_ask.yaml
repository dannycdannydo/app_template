name: document.ask
prompt_name: document.ask
prompt_version: 1
input_variables:
  - storage_reference
  - question
required_capabilities:
  - documents
parameter_defaults:
  max_tokens: 1024
  temperature: 0
declares_text_result: true
# v0.8 Scope §2.2: the demonstration QA task carries a PDF inline at or below
# the 5,000,000-byte aggregate threshold and through the Vertex private GCS
# staging path (storage_reference) above it, matching the Vertex model and
# provider transfer contract.
allowed_transfer_modes:
  - inline
  - storage_reference
# The QA demo does not opt into retaining validated output content: the
# durable record keeps status, routing and usage only (BP §28, ADR-0017).
retains_output_content: false
retry_policy:
  max_attempts: 2
  repair_attempts: 0
fallback_policy:
  allowed: true
  prefer_same_provider: false
  allow_local: true
model_preferences:
  # Vertex first so the UI test routes through Vertex when the adapter is
  # configured (v0.8 Scope §6.4); the deterministic fake stays as the
  # configured-provider fallback so the default suite exercises the same task
  # hermetically and the demo keeps working without provider credentials.
  - vertex.gemini-2.0-flash
  - fake.document-classifier
quality_tier: economy
latency_tier: interactive
max_input_tokens: 4096
max_estimated_cost: "0.02"
