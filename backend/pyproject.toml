[project]
name = "app-template-backend"
version = "0.5.0"
description = "FastAPI backend for the application starter template"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "boto3>=1.38.0",
    "dramatiq[redis]>=1.18.0",
    "fastapi>=0.141.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.10.0",
    "prometheus-client>=0.20.0",
    "redis==6.4.0",
    "sentry-sdk>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.1",
    "workos>=6.0.0",
]

[dependency-groups]
dev = [
    "cryptography>=44.0.0",
    "httpx>=0.28.1",
    "pyright>=1.1.402",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

# base.py imports model modules at the bottom of the file so their tables are
# registered on Base.metadata for Alembic autogenerate (see the file itself).
[tool.ruff.lint.per-file-ignores]
"app/db/base.py" = ["E402", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["app", "tests", "scripts"]
exclude = ["**/__pycache__"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The default suite must stay provider-free (Scope §6.2): MinIO-backed S3
# adapter tests carry the storage_integration marker and are excluded unless
# explicitly requested with `uv run pytest -m storage_integration`. A CLI -m
# overrides this expression, so the marker can be run on its own.
addopts = "-ra -m 'not storage_integration'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "storage_integration: S3 adapter tests that need a live S3-compatible service (MinIO); skipped when unreachable",
]
