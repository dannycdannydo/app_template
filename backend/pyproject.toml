[project]
name = "app-template-backend"
version = "0.7.0"
description = "FastAPI backend for the application starter template"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "boto3>=1.38.0",
    "dramatiq[redis]>=1.18.0",
    "fastapi>=0.141.1",
    # v0.7 AI provider adapters (Scope §6.3, ADR-0017) are pinned HTTP REST
    # clients instead of provider SDKs: the OpenAI, Anthropic, DeepSeek,
    # Azure OpenAI, Vertex AI and local OpenAI-compatible wire formats are
    # implemented over httpx (promoted from a dev dependency), so the
    # provider-SDK import boundary stays airtight and the fake-provider
    # default plus opt-in contract tests share one transport. No provider SDK
    # (openai, anthropic, google-cloud-aiplatform, ...) is a dependency; that
    # is a deliberate, reviewed decision (ADR-0017 consequences).
    "httpx>=0.28.1",
    # v0.7 Vertex AI adapter (v0.7 Scope §6.3, ADR-0018): google-auth supplies
    # Application Default Credentials / service-account credentials for the
    # Vertex generateContent endpoint. Token refresh uses the urllib3
    # transport already provided by boto3, so no extra HTTP client is pulled
    # in. Imported only inside app/ai/providers/vertex.py.
    "google-auth[urllib3]>=2.35.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    # v0.8 provider-neutral PDF policy inspection (Scope §6.6, ADR-0017):
    # use a maintained parser for incremental updates, xref streams and
    # compressed object streams instead of rejecting normal modern PDFs or
    # maintaining a partial security-sensitive parser in the template.
    "pypdf>=6.16.0",
    # v0.7 prompt/task/model registries are reviewed YAML assets. PyYAML's
    # safe loader is used (never the object-constructing loader); it was
    # already present transitively and is now an explicit runtime contract.
    "pyyaml>=6.0.3",
    "pyjwt>=2.10.0",
    # v0.6 observability (Scope §6.1, blueprint §28): Prometheus text-format
    # metrics on GET /metrics; sentry-sdk for error tracking, initialised only
    # when SENTRY_DSN is set. Both are pinned by uv.lock and justified in
    # ADR-0015 (dependency additions; the edge rate-limit module
    # caddy-ratelimit v0.1.0 is pinned separately in deploy/caddy/Dockerfile).
    "prometheus-client>=0.20.0",
    "redis==6.4.0",
    "sentry-sdk>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.1",
    "workos>=6.0.0",
]

[dependency-groups]
dev = [
    "cryptography>=44.0.0",
    "pyright>=1.1.402",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.12.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts"]

# base.py imports model modules at the bottom of the file so their tables are
# registered on Base.metadata for Alembic autogenerate (see the file itself).
[tool.ruff.lint.per-file-ignores]
"app/db/base.py" = ["E402", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
include = ["app", "tests", "scripts"]
exclude = ["**/__pycache__"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The default suite must stay provider-free (Scope §6.2): MinIO-backed S3
# adapter tests carry the storage_integration marker, Mailhog-backed SMTP
# adapter tests carry the email_integration marker, and live AI provider
# contract tests carry the ai_contracts marker; all are excluded unless
# explicitly requested with `uv run pytest -m storage_integration` /
# `uv run pytest -m email_integration` / `uv run pytest -m ai_contracts`.
# A CLI -m overrides this expression, so each marker can be run on its own.
addopts = "-ra -m 'not storage_integration and not email_integration and not ai_contracts'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "storage_integration: S3 adapter tests that need a live S3-compatible service (MinIO); skipped when unreachable",
    "email_integration: SMTP adapter tests that need a live SMTP relay (Mailhog); skipped when unreachable",
    "ai_contracts: opt-in live AI provider contract tests that need dedicated non-production credentials (Scope §6.3); skipped when credentials are absent",
]
