# Local development Compose file (blueprint §36, ADR-0008).
#
# The default service set is infrastructure only: PostgreSQL, Redis, MinIO and
# Mailhog, which the host-native applications connect to under `make dev`. The
# `fullstack` profile adds the API, worker and frontend containers for
# `make dev-docker` (CI parity, onboarding, Dockerfile validation), so one
# file serves both commands without adding a fourth Compose file.

name: app-template

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # Redis declares /data as an image VOLUME. Bind it explicitly so Docker
    # does not create an opaque anonymous volume that can preserve Dramatiq
    # messages across container recreation. PostgreSQL, Redis and MinIO are
    # deliberately reset together by `make dev-reset` so broker job ids never
    # outlive the database rows they reference.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for local development (Scope §6.2, ADR-0006).
  # Private bucket model: the API issues short-lived signed URLs and the
  # browser uploads/downloads directly; nothing here is ever public. The S3
  # API is published on MINIO_PORT (9000) and the admin console on
  # MINIO_CONSOLE_PORT (9001). The dev defaults below match the STORAGE_*
  # defaults in `.env.example` (minioadmin/minioadmin).
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Local SMTP catcher for development email (Scope §6.2, ADR-0015). The
  # host-native `make dev` API/worker reach it on MAILHOG_SMTP_PORT (1025)
  # via the SMTP_* defaults in `.env.example`; the web UI on
  # MAILHOG_UI_PORT (8025) shows every message the worker sends.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  # Full-container path (`make dev-docker`): the same image that serves CI and
  # production profiles. Migrations run on container start so a fresh clone
  # works with a single command; the host-native `make migrate` targets the
  # published port instead.
  api:
    profiles: ["fullstack"]
    build:
      context: ../../backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://redis:6379/0
      WORKOS_API_KEY: ${WORKOS_API_KEY:-}
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
      WORKOS_API_BASE_URL: ${WORKOS_API_BASE_URL:-https://api.workos.com/}
      WORKOS_JWT_ISSUER: ${WORKOS_JWT_ISSUER:-https://api.workos.com/}
      WORKOS_JWT_LEEWAY: ${WORKOS_JWT_LEEWAY:-30}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-["http://localhost:5173"]}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-["localhost","127.0.0.1","test"]}
      # In the container stack the API reaches MinIO on the compose network
      # (minio:9000), while the browser pre-signs against the published port
      # (localhost:9000) via STORAGE_PUBLIC_ENDPOINT_URL.
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-app-files}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://minio:9000}
      STORAGE_PUBLIC_ENDPOINT_URL: ${STORAGE_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
      STORAGE_MAX_UPLOAD_SIZE: ${STORAGE_MAX_UPLOAD_SIZE:-26214400}
      STORAGE_ALLOWED_CONTENT_TYPES: ${STORAGE_ALLOWED_CONTENT_TYPES:-'["application/pdf","application/json","text/plain","text/csv","image/png","image/jpeg"]'}
      # In the container stack the worker reaches Mailhog on the compose
      # network (mailhog:1025); the host-native `make dev` path uses the
      # SMTP_* defaults in `.env.example` (localhost:1025).
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@example.com}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Dramatiq worker (Scope §6.2, blueprint §36): the same backend image with
  # a different runtime command. It shares the API's database, Redis broker,
  # storage and email configuration; the worker will read and write durable
  # job records once the job service lands (Scope §6.4).
  worker:
    profiles: ["fullstack"]
    build:
      context: ../../backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
      REDIS_URL: redis://redis:6379/0
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-app-files}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://minio:9000}
      STORAGE_PUBLIC_ENDPOINT_URL: ${STORAGE_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
      # Email is always sent from the worker (BP §20); in the container stack
      # it reaches Mailhog on the compose network (mailhog:1025).
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@example.com}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-8}
    command: >
      sh -c "dramatiq app.workers --processes 1 --threads $${WORKER_CONCURRENCY:-8} --worker-shutdown-timeout 10000"

  frontend:
    profiles: ["fullstack"]
    build:
      context: ../../frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WORKOS_CLIENT_ID: ${VITE_WORKOS_CLIENT_ID:-}
        VITE_WORKOS_REDIRECT_URI: ${VITE_WORKOS_REDIRECT_URI:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres_data:
  redis_data:
  minio_data:
